plugins {
    id 'com.android.application'
}

android {
    namespace "com.splashdown.recomp"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.splashdown.recomp"
        // the native libraries are built against android-33 stubs (build-native.sh), so the floor is 33
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // libmain.so and libSDL3.so are built by build-native.sh into jniLibs, not by Gradle's own CMake run
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }


}

dependencies {
}
