# Recompiler input for default.xbe. XDK 4928 has no SDK signature set; [symbols] and
# [data] come from XbSymbolDatabase via sdk/tools/symbols/xbsdb_import.py. Names left
# at 0 are trapping stubs.
[xbe]
path = "assets/default.xbe"
title = 0x53450007
entry = 0x231E6C
xdk = 4928
out = "generated/game"
partitions = 64
code_sections = [".text", "MMATRIX", "D3D", "D3DX", "DSOUND", "WMADEC", "PSGSFD00", "PSGSFD_I", "PSGSFD_B", "PSGSFD_P", "XGRPH", "XPP"]

# extra entry points
[functions]
# Aligned virtual methods in the class tables at 0x331F00..0x333820. The
# sweep started at their preceding padding, so code existed but indirect
# dispatch had no entry for the addresses actually stored in the tables.
0x269CD0 = ""
0x269F50 = ""
0x26A120 = ""
0x26A460 = ""
0x27F4B0 = ""
0x283B60 = ""
0x2898C0 = ""
0x289C70 = ""
0x28A070 = ""
0x28B250 = ""
0x28B850 = ""
0x28BED0 = ""
0x28D070 = ""
0x28D850 = ""
0x28DA30 = ""
0x27FE40 = "" # graphics vtable at 0x332D00, called indirectly by scene setup at 0x446F2
0x280340 = "" # graphics vtable slot 0x332D94; entry after an alignment sequence
0x280460 = "" # graphics vtable slot 0x332D68; entry after an alignment sequence
0x28A5E0 = "" # virtual method in the table at 0x333480; alignment/jumps hid its entry from discovery
0x2918E0 = "" # vertical-blank callback registered by the code at 0x2918F8; increments a frame counter

[[hook]]
at = 0x21E4D3        # just after the title's DirectSoundCreate call in sub_0021E4A0
call = "FixDsStore"  # replace the stored object with the fabricated interface (src/game/hooks.cpp)

