# VC3 from the user-supplied MYSTRO Xbox ISO: XDK 5028, retail-key XBE.
# Keep addresses and layouts separate from the Rev B XDK 5455 executable.
includes = ["xdk-5028.toml"]
[xbe]
path = "assets/default.xbe"
title = 0
entry = 0xB6407
out = "generated/game"
partitions = 32
code_sections = [".text", "D3D", "D3DX", "XGRPH", "DSOUND", "XPP", "PSGSFD00", "PSGSFD_I", "PSGSFD_B", "PSGSFD_P"]

[functions]
0xB1840 = "" # Callback observed at 0x69F55 after the region notice.
0xB1820 = "" # Registered alongside B1840 by constructor 0xB1860.
0xB17E0 = "" # Registered alongside B1840 by constructor 0xB1860.
0xB17B0 = "" # Registered alongside B1840 by constructor 0xB1860.

