[[hook]]
at = 0x7D230
call = "VCop3_SelectControllerInput"
after = true

[[hook]]
at = 0x108150
call = "VCop3_DrainVisibilityCommands"

[[hook]]
at = 0x395D3
call = "VCop3_UseGameCanvas"

[[hook]]
at = 0x7B09C
call = "VCop3_ApplyMouseAim"

# Bracket the actual game state read, excluding XPP's background port checks.
[[hook]]
at = 0x7C843
call = "VCop3_BeginMousePoll"

[[hook]]
at = 0x7C843
call = "VCop3_EndMousePoll"
after = true

[[hook]]
at = 0x82843
call = "VCop3_CommitMovieFrame"
after = true
