# XDK 4721 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Need for Speed: Hot Pursuit 2, USA, title 45410028) code at the address given; function addresses from
# XbSymbolDatabase. Most CDevice fields sit 0x450 below their 5849 place; the miniport block keeps its own layout.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at (0x176260)
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x1684B2 reads it, compares with +4, calls MakeSpace 0x16CE50
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x1684B4 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x1686C9 stores BaseVertexIndex
CDevice_IndexBuffer   = 0x38C   # D3DDevice_SetIndices 0x16869A reads the old one, 0x1686C2 stores the new one
CDevice_ZScale        = 0x510   # D3DDevice_GetViewportOffsetAndScale 0x1696E5 scales the Z range by it
CDevice_SuperSampleX  = 0x518   # D3DDevice_GetViewportOffsetAndScale 0x16963E scales viewport X by it
CDevice_SuperSampleY  = 0x51C   # D3DDevice_GetViewportOffsetAndScale 0x169660 scales viewport Y by it
CDevice_Transforms    = 0x810   # D3DDevice_SetTransform 0x167B06 copies 16 dwords to +0x810 + type * 64
CDevice_Textures      = 0xB38   # D3DDevice_SetTexture 0x168470 reads, 0x1684A9 stores [stage]
CDevice_Palettes      = 0xB48   # D3DDevice_SetPalette 0x1685ED reads, 0x168625 stores [stage]
CDevice_RenderTarget  = 0x21B4  # D3DDevice_SetViewport 0x16830A compares it with the back buffer
CDevice_Depth         = 0x21B8  # D3DDevice_GetDepthStencilSurface2 0x1682E6 returns it
CDevice_BackBuffer    = 0x21C0  # D3DDevice_GetBackBuffer2 0x167F40 returns it for index 0
CDevice_FrontBuffer   = 0x21C4  # D3DDevice_GetBackBuffer2 0x167F25 returns it for index -1
CDevice_SwapCount     = 0x2C10  # D3DDevice_Swap 0x1677B0 increments it
CDevice_Size          = 0x2C30  # Direct3D_CreateDevice 0x16AEDB clears 0xB0C dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x16AE96 ors BehaviorFlags & 0x10 into it (0x176268)
CDevice_Time              = 0x30   # D3DDevice_SetTexture 0x168483 and SetStreamSource 0x16B7AA store it as the lock time
CDevice_PixelShader       = 0x370  # D3DDevice_SetPixelShader 0x16BD38 stores the handle
CDevice_VertexShader      = 0x380  # XbSymbolDatabase D3DDevice__m_VertexShader_OFFSET
CDevice_BackBufferScale   = 0x528  # the frame buffer init 0x16FE1B stores the X scale as a float, 0x16FE34 the Y scale at +4
CDevice_Viewport          = 0xA90  # D3DDevice_GetViewportOffsetAndScale 0x169625 to 0x1696DF reads X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xAA8  # D3DDevice_SetScreenSpaceOffset 0x168C33 stores x, 0x168C43 y at +4
CDevice_AutoDepth         = 0x21CC # the frame buffer init 0x16FEE2 stores the depth buffer
# the miniport at +0x23C0 (D3DDevice_SetGammaRamp 0x167A43), laid out as in 5849
CDevice_VBlankCallback    = 0x2550 # miniport + 0x190; XbSymbolDatabase D3DDevice__m_VBlankCallback_OFFSET
CDevice_VBlankEvent       = 0x2554 # D3DDevice_BlockUntilVerticalBlank 0x167C7B clears its SignalState at +4
CDevice_DisplayFlags      = 0x2574 # miniport + 0x1B4
CDevice_VBlankCount       = 0x2580 # miniport + 0x1C0
CDevice_Field             = 0x2590 # miniport + 0x1D0
CDevice_GammaRamps        = 0x259C # D3DDevice_SetGammaRamp 0x167A73 copies to miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2B9C # miniport + 0x7DC + index * 4; the index at miniport + 0x7E4 (0x167A49)
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x1684E5 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x16A00B: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x16B79A indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x16B7E2 stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x16B7E8 stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_CreatePixelShader 0x16BCD1 stores the definition pointer
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor 0x185700 stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor 0x1856F9 stores the second vtable
EffectsImage_Skip0    = 0x804   # 0x186245 (reached from CDirectSound_DownloadEffectsImage) adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x18623F loads this dword count
EffectsImage_Desc     = 0x818   # 0x18624E: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices 0x1A8C03 returns it
XPP_Changed           = 0x4     # XGetDevices 0x1A8C05 clears it, XGetDeviceChanges 0x1A8C23 tests it
XPP_Previous          = 0x8     # XGetDevices 0x1A8C0B copies Current into it
